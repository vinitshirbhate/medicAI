[project]
name = "backend"
version = "0.1.0"
description = "Sundara Command clinical decision-support demo backend"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115,<1.0",
    "python-multipart>=0.0.20,<1.0",
    "soundfile>=0.13,<1.0",
    "torch>=2.5,<3.0",
    "transformers>=4.50,<5.0",
    "psycopg[binary]>=3.2,<4.0",
    "pymongo>=4.9,<5.0",
    "dnspython>=2.6,<3.0",
    "python-dotenv>=1.0,<2.0",
    "httpx>=0.28,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
